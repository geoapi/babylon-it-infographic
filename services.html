    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* -------------------------------------------------------------
           THEME DEFINITIONS USING CSS CUSTOM PROPERTIES
        ------------------------------------------------------------- */
        :root[data-theme="midnight"] {
            --bg-main: #090d16;
            --bg-nav: rgba(15, 23, 42, 0.85);
            --bg-surface: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(99, 102, 241, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-soft: rgba(99, 102, 241, 0.12);
            --badge-bg: rgba(99, 102, 241, 0.1);
            --badge-text: #818cf8;
            --shadow-glow: 0 10px 30px -10px rgba(99, 102, 241, 0.2);
        }

        :root[data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-nav: rgba(255, 255, 255, 0.85);
            --bg-surface: #ffffff;
            --bg-card: #f1f5f9;
            --bg-card-hover: #e2e8f0;
            --border-color: #cbd5e1;
            --border-accent: rgba(37, 99, 235, 0.3);
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-primary: #2563eb;
            --accent-gradient: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
            --accent-soft: rgba(37, 99, 235, 0.08);
            --badge-bg: rgba(37, 99, 235, 0.1);
            --badge-text: #1d4ed8;
            --shadow-glow: 0 10px 25px -5px rgba(37, 99, 235, 0.12);
        }

        :root[data-theme="emerald"] {
            --bg-main: #04120f;
            --bg-nav: rgba(6, 30, 25, 0.85);
            --bg-surface: #0a2722;
            --bg-card: #113a33;
            --bg-card-hover: #184e45;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(16, 185, 129, 0.3);
            --text-main: #f0fdf4;
            --text-muted: #94a3b8;
            --accent-primary: #10b981;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
            --accent-soft: rgba(16, 185, 129, 0.12);
            --badge-bg: rgba(16, 185, 129, 0.12);
            --badge-text: #34d399;
            --shadow-glow: 0 10px 30px -10px rgba(16, 185, 129, 0.25);
        }

        :root[data-theme="amethyst"] {
            --bg-main: #0f0a1c;
            --bg-nav: rgba(24, 15, 43, 0.85);
            --bg-surface: #1d1334;
            --bg-card: #2c1d4d;
            --bg-card-hover: #3d2a68;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(168, 85, 247, 0.3);
            --text-main: #faf5ff;
            --text-muted: #a78bfa;
            --accent-primary: #a855f7;
            --accent-gradient: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            --accent-soft: rgba(168, 85, 247, 0.15);
            --badge-bg: rgba(168, 85, 247, 0.12);
            --badge-text: #c084fc;
            --shadow-glow: 0 10px 30px -10px rgba(168, 85, 247, 0.3);
        }

        :root[data-theme="amber"] {
            --bg-main: #120d08;
            --bg-nav: rgba(31, 20, 11, 0.85);
            --bg-surface: #21160d;
            --bg-card: #332316;
            --bg-card-hover: #473220;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(245, 158, 11, 0.3);
            --text-main: #fffbeb;
            --text-muted: #d97706;
            --accent-primary: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
            --accent-soft: rgba(245, 158, 11, 0.12);
            --badge-bg: rgba(245, 158, 11, 0.12);
            --badge-text: #fbbf24;
            --shadow-glow: 0 10px 30px -10px rgba(245, 158, 11, 0.25);
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .bg-nav-glass {
            background-color: var(--bg-nav);
            backdrop-filter: blur(12px);
        }

        .bg-surface-theme { background-color: var(--bg-surface); }
        .bg-card-theme { background-color: var(--bg-card); }
        .border-theme { border-color: var(--border-color); }
        .border-accent-theme { border-color: var(--border-accent); }
        
        .text-main-theme { color: var(--text-main); }
        .text-muted-theme { color: var(--text-muted); }
        
        .accent-bg { background-color: var(--accent-primary); }
        .accent-soft-bg { background-color: var(--accent-soft); }
        .accent-gradient-bg { background: var(--accent-gradient); }
        .accent-text { color: var(--accent-primary); }
        .badge-bg { background-color: var(--badge-bg); }
        .badge-text { color: var(--badge-text); }
        .shadow-glow { box-shadow: var(--shadow-glow); }

        .fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--bg-card-hover); border-radius: 9999px; }
    </style>
</head>
